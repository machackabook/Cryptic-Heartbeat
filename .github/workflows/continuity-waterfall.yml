name: Continuity Waterfall

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, closed]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  env-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          echo "repo=${GITHUB_REPOSITORY}"
          test -f README.md
          test -n "${GITHUB_SHA}"
          echo "NUMERAL=137451921129154222"

  catalog:
    needs: env-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List scripts and docs
        run: |
          find . -maxdepth 3 -type f | head -n 80
