name: cascade-enhance
on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [continuity-cascade, pull-then-push]
permissions:
  contents: read
jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: require README and SECURITY
        run: test -f README.md && test -f SECURITY.md
      - name: stamp present
        run: test -f docs/LEDGER-STAMP.md
      - name: numeral remembered in README
        run: grep -q 137451921129154222 README.md
      - name: no obvious secret files in tree
        run: |
          ! test -f .env
          ! test -f secrets.yml
          ! test -f id_rsa
