name: continuity-hourly
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: append immutable hourly stamp
        run: |
          mkdir -p ledger
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "- $TS Cryptic-Heartbeat hourly stamp numeral=137451921129154222" >> ledger/hourly-stamp.md
      - name: commit if dirty
        run: |
          git config user.name "team-enhance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/hourly-stamp.md
          git diff --cached --quiet || git commit -m "ledger: hourly continuity stamp"
          git push
