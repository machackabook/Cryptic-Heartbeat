name: hourly-continuity
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stamp ledger
        run: |
          mkdir -p docs/ledgers
          echo "{\"ts\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"numeral\":\"137451921129154222\",\"event\":\"${{ github.event_name }}\",\"sha\":\"${{ github.sha }}\"}" >> docs/ledgers/heartbeat.jsonl
      - name: commit if dirty
        run: |
          git config user.name "continuity-engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ledgers/heartbeat.jsonl
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "ledger: hourly continuity heartbeat"
          git push
