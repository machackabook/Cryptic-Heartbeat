name: hourly-continuity
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Env check
        run: bash scripts/env_check.sh
      - name: Append heartbeat
        run: |
          mkdir -p docs/ledgers
          echo "{\"t\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"repo\":\"Cryptic-Heartbeat\",\"stage\":88,\"numeral\":\"137451921129154222\",\"event\":\"${{ github.event_name }}\"}" >> docs/ledgers/heartbeat.jsonl
          printf '# Ledger stamp\n\nSTAGE 88 Cryptic-Heartbeat\nUTC %s\nevent %s\nnumeral 137451921129154222\nnext The-Hive\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.event_name }}" > docs/LEDGER-STAMP.md
      - name: Commit stamp
        run: |
          git config user.name "continuity-engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ledgers/heartbeat.jsonl docs/LEDGER-STAMP.md
          git diff --cached --quiet || git commit -m "chore(continuity): hourly stamp STAGE 88"
          git push || true
