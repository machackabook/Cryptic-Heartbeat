name: hourly-enhance
on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/env_check.sh || true
      - run: |
          mkdir -p ledger
          echo "{\"ts\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"event\":\"heartbeat-enhance\"}" >> ledger/hourly-enhance.jsonl
          git config user.name team-enhance
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ledger/hourly-enhance.jsonl
          git diff --cached --quiet || git commit -m "ledger: heartbeat hourly"
          git push || true
